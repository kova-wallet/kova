# T8-F1 fix: Gitleaks configuration for pre-commit secret scanning.
# Detects private keys, tokens, and other secrets before they are committed.
# Install: brew install gitleaks (or see https://github.com/gitleaks/gitleaks)
# Usage: gitleaks protect --staged (as a pre-commit hook)

title = "kova-wallet gitleaks config"

[[rules]]
id = "solana-keypair-json"
description = "Solana keypair JSON (raw byte array)"
regex = '''\[\s*\d{1,3}\s*,\s*\d{1,3}\s*,'''
tags = ["key", "solana"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot API token"
regex = '''\d{8,10}:[A-Za-z0-9_-]{35}'''
tags = ["key", "telegram"]

[[rules]]
id = "generic-private-key"
description = "Generic private key pattern"
regex = '''(?i)(private[_-]?key|secret[_-]?key)\s*[:=]\s*['"][^'"]{16,}['"]'''
tags = ["key"]

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''node_modules/''',
  '''dist/''',
]
