name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci validates lockfile integrity and installs native addons
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # LOW-T5-04 fix: Run tests with coverage reporting and enforce minimum threshold
      - name: Run tests with coverage
        run: npx vitest run --coverage --coverage.thresholds.lines=70 --coverage.thresholds.functions=70 --coverage.thresholds.branches=70 --coverage.thresholds.statements=70

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Note: npm audit --omit=dev currently reports bigint-buffer (transitive via
      # @solana/web3.js -> @solana/spl-token -> @solana/buffer-layout-utils).
      # The fix requires a breaking @solana/spl-token downgrade. Non-blocking until
      # upstream publishes a patched version (tracked in .gitignore notes).
      - name: Audit production dependencies
        run: npm audit --omit=dev || true
        continue-on-error: true

      # SUPPLY-013 fix: Also audit devDependencies (non-blocking).
      # DevDependencies execute during build and test in CI, so vulnerable
      # devDependencies could be exploited during CI runs.
      - name: Audit all dependencies (including dev)
        run: npm audit || true
        continue-on-error: true

      - name: Verify package signatures
        run: npm audit signatures

      - name: Check for pinned dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = pkg.dependencies || {};
            const unpinned = Object.entries(deps).filter(([,v]) => /^[\^~>]/.test(v));
            if (unpinned.length > 0) {
              console.error('Unpinned production dependencies found:');
              unpinned.forEach(([k,v]) => console.error('  ' + k + ': ' + v));
              process.exit(1);
            }
            console.log('All production dependencies are pinned.');
          "
