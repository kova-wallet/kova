# Kova Dashboard — Docker Compose
#
# Usage:
#   docker compose up              # Start dashboard (devnet, no auth)
#   docker compose up -d           # Start in background
#   docker compose --env-file .env.production up   # Use production config
#
# The dashboard connects to a Solana RPC endpoint (default: devnet).
# For local development with solana-test-validator, use:
#   KOVA_NETWORK=localnet KOVA_RPC_URL=http://host.docker.internal:8899

services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - KOVA_NETWORK=${KOVA_NETWORK:-devnet}
      - KOVA_RPC_URL=${KOVA_RPC_URL:-}
      - KOVA_STORE_TYPE=${KOVA_STORE_TYPE:-sqlite}
      - KOVA_SQLITE_PATH=/app/data/kova.db
      - KOVA_SIGNER_TYPE=${KOVA_SIGNER_TYPE:-local}
      - KOVA_DASHBOARD_PASSWORD=${KOVA_DASHBOARD_PASSWORD:-}
      - KOVA_SESSION_SECRET=${KOVA_SESSION_SECRET:-}
      - TURNKEY_API_BASE_URL=${TURNKEY_API_BASE_URL:-}
      - TURNKEY_API_PUBLIC_KEY=${TURNKEY_API_PUBLIC_KEY:-}
      - TURNKEY_API_PRIVATE_KEY=${TURNKEY_API_PRIVATE_KEY:-}
      - TURNKEY_ORGANIZATION_ID=${TURNKEY_ORGANIZATION_ID:-}
      - TURNKEY_WALLET_ADDRESS=${TURNKEY_WALLET_ADDRESS:-}
    volumes:
      - kova-data:/app/data
    restart: unless-stopped

volumes:
  kova-data:
