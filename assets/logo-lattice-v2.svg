<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    KOVA Logo — "Lattice Iso"
    Team 3 (round 2): Designer Rafael Moreno × Branding Specialist Ingrid Svensson

    Evolution: The original Lattice used flat colored facets to suggest
    depth. This version goes full ISOMETRIC 3D — each segment of the K
    has a visible front face AND a right-side depth face, creating a
    convincing block-letter illusion extruded from the hexagonal surface.

    Front faces use the original bright palette. Right/depth faces are
    one step darker, creating consistent directional lighting (light
    from upper-left). The K appears to physically rise out of the
    hexagonal base like a crystalline growth.

    The lattice grid is removed for cleanliness. The cyan keystone
    diamond remains as the anchoring brand element.

    Audience signal: Premium 3D craft, architectural precision, modern crypto.
    Best for: App store icons, 3D renders, merchandise, brand hero, social.
  -->
  <defs>
    <linearGradient id="li-hex" x1="256" y1="36" x2="256" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3730a3"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="li-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal frame (pointy-top) -->
  <polygon points="256,36 447,146 447,366 256,476 65,366 65,146" fill="url(#li-hex)"/>

  <!-- Inner hex highlight -->
  <polygon points="256,56 427,158 427,354 256,456 85,354 85,158" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.12"/>

  <!-- ============================================ -->
  <!-- ISOMETRIC K — depth faces drawn FIRST (behind) -->
  <!-- Extrusion offset: (14, 8) → right and down   -->
  <!-- ============================================ -->

  <!-- Depth: Bar top half — right face -->
  <polygon points="214,138 228,146 228,264 214,256" fill="#818cf8"/>

  <!-- Depth: Bar bottom half — right face -->
  <polygon points="214,262 228,270 228,388 214,380" fill="#4f46e5"/>

  <!-- Depth: Bar bottom half — bottom face -->
  <polygon points="170,380 214,380 228,388 184,388" fill="#312e81"/>

  <!-- Depth: Upper arm — right face -->
  <polygon points="336,138 350,146 350,186 336,178" fill="#6366f1"/>

  <!-- Depth: Upper arm — top face (connects extrusion) -->
  <polygon points="218,220 232,228 350,146 336,138" fill="#a5b4fc" opacity="0.5"/>

  <!-- Depth: Lower arm — right face -->
  <polygon points="336,340 350,348 350,384 336,376" fill="#3730a3"/>

  <!-- Depth: Lower arm — bottom face -->
  <polygon points="218,300 232,308 350,384 336,376" fill="#312e81" opacity="0.7"/>

  <!-- ============================================ -->
  <!-- ISOMETRIC K — front faces drawn ON TOP        -->
  <!-- ============================================ -->

  <!-- Front: Bar top half (brightest — catches light) -->
  <rect x="170" y="138" width="44" height="118" fill="#c7d2fe"/>

  <!-- Front: Bar bottom half (medium) -->
  <rect x="170" y="262" width="44" height="118" fill="#818cf8"/>

  <!-- Front: Upper arm (light) -->
  <polygon points="218,220 336,138 336,178 218,254" fill="#a5b4fc"/>

  <!-- Front: Lower arm (deep) -->
  <polygon points="218,268 218,300 336,376 336,340" fill="#6366f1"/>

  <!-- Junction gap separator -->
  <line x1="170" y1="256" x2="214" y2="256" stroke="#1e1b4b" stroke-width="3"/>
  <line x1="170" y1="262" x2="214" y2="262" stroke="#1e1b4b" stroke-width="3"/>

  <!-- Keystone — cyan diamond at junction (same as original) -->
  <polygon points="230,259 256,240 282,259 256,278" fill="url(#li-accent)"/>
  <polygon points="243,259 256,248 269,259 256,270" fill="white" opacity="0.3"/>

  <!-- Subtle top-edge highlights on front faces (light catch) -->
  <line x1="170" y1="138" x2="214" y2="138" stroke="white" stroke-width="1" opacity="0.2"/>
  <line x1="218" y1="220" x2="336" y2="138" stroke="white" stroke-width="0.75" opacity="0.15"/>
</svg>
