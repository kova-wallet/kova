<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    KOVA Logo — "Sigil"
    Team 4: Designer Lena Jørgensen × Branding Specialist Kai Okonkwo

    Concept: NO letter K. Instead, two code brackets < > interlock,
    forming a diamond in the negative space where they cross. This is
    a developer-native symbol — < > is the universal syntax for types,
    generics, and constraints. For Kova, the < represents the POLICY
    CONSTRAINTS that wrap every transaction, while the > represents
    the APPROVED OUTPUT that emerges. Their intersection creates a
    diamond — the protected value at the center of the system.

    The indigo < and cyan > tell the brand color story through pure
    geometry. The white diamond highlight and center keystone dot
    anchor the viewer's eye at the point where constraint meets approval.

    Audience signal: Developer-first, code-native, intellectually elegant.
    Best for: npm badges, CLI headers, terminal splash, dev documentation.
  -->
  <defs>
    <linearGradient id="sig-left" x1="310" y1="122" x2="166" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sig-right" x1="202" y1="122" x2="346" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0c0a20"/>
  <rect x="4" y="4" width="504" height="504" rx="78" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.12"/>

  <!-- Left bracket < (indigo — the policy constraint) -->
  <path d="M310,122 L166,256 L310,390"
        stroke="url(#sig-left)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right bracket > (cyan — the approved output) -->
  <path d="M202,122 L346,256 L202,390"
        stroke="url(#sig-right)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Diamond highlight at the intersection zone -->
  <!-- Crossings occur at (256,172) and (256,340); tips at (166,256) and (346,256) -->
  <polygon points="166,256 256,172 346,256 256,340" fill="white" opacity="0.07"/>

  <!-- Inner diamond edge -->
  <polygon points="196,256 256,204 316,256 256,308" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- Center keystone dot — where constraint meets approval -->
  <circle cx="256" cy="256" r="8" fill="white" opacity="0.9"/>
</svg>
