<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    KOVA Logo — "Lattice"
    Team 3: Designer Rafael Moreno × Branding Specialist Ingrid Svensson

    Concept: A crystalline K inside a hexagonal frame, inspired by blockchain
    architecture and lattice cryptography. The K is deconstructed into four
    geometric facets — each a different shade of indigo — creating a 3D
    gem-like appearance. This represents Kova's multi-layered security:
    policies, signing, auditing, and circuit breakers all working as facets
    of a single system.

    The hexagonal container references both blockchain blocks and molecular
    structure. The cyan diamond at the junction is the "keystone" — the
    policy engine that holds everything together. Small gaps between facets
    suggest modularity and composability.

    Audience signal: Crypto-native, precision-engineered, premium.
    Best for: Token branding, app icons, conference materials, merchandise.
  -->
  <defs>
    <linearGradient id="lat-hex" x1="256" y1="36" x2="256" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lat-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal frame (pointy-top) -->
  <polygon points="256,36 447,146 447,366 256,476 65,366 65,146" fill="url(#lat-hex)"/>

  <!-- Inner hex highlight -->
  <polygon points="256,56 427,158 427,354 256,456 85,354 85,158" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.15"/>

  <!-- Subtle lattice grid inside hex -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.08">
    <line x1="120" y1="200" x2="392" y2="200"/>
    <line x1="105" y1="240" x2="407" y2="240"/>
    <line x1="100" y1="280" x2="412" y2="280"/>
    <line x1="105" y1="320" x2="407" y2="320"/>
    <line x1="120" y1="360" x2="392" y2="360"/>
    <line x1="200" y1="100" x2="200" y2="420"/>
    <line x1="256" y1="70"  x2="256" y2="450"/>
    <line x1="312" y1="100" x2="312" y2="420"/>
  </g>

  <!-- K — four separated geometric facets -->

  <!-- Facet 1: Vertical bar, top half (brightest) -->
  <rect x="170" y="138" width="44" height="118" rx="2" fill="#c7d2fe"/>

  <!-- Facet 2: Vertical bar, bottom half (medium) -->
  <rect x="170" y="262" width="44" height="118" rx="2" fill="#818cf8"/>

  <!-- Facet 3: Upper arm (light) -->
  <polygon points="218,220 336,138 336,178 218,254" fill="#a5b4fc"/>

  <!-- Facet 4: Lower arm (deep) -->
  <polygon points="218,268 218,300 336,376 336,340" fill="#6366f1"/>

  <!-- Facet edge highlights (crystal refraction) -->
  <line x1="218" y1="220" x2="336" y2="138" stroke="#e0e7ff" stroke-width="1" opacity="0.35"/>
  <line x1="218" y1="268" x2="336" y2="340" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  <line x1="170" y1="256" x2="214" y2="256" stroke="#1e1b4b" stroke-width="4"/>
  <line x1="170" y1="262" x2="214" y2="262" stroke="#1e1b4b" stroke-width="4"/>

  <!-- Keystone — cyan diamond at junction -->
  <polygon points="230,259 256,240 282,259 256,278" fill="url(#lat-glow)"/>

  <!-- Diamond inner shine -->
  <polygon points="243,259 256,248 269,259 256,270" fill="white" opacity="0.3"/>

  <!-- Corner accent dots (lattice nodes) -->
  <circle cx="170" cy="138" r="3" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="214" cy="138" r="3" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="336" cy="138" r="3" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="336" cy="376" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="170" cy="380" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="214" cy="380" r="3" fill="#818cf8" opacity="0.5"/>
</svg>
